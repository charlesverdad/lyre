<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- `viewport-fit=cover` (task F1 follow-up, docs/PLAN-v0.4.md) lets Android's
		WebView paint edge-to-edge under the status/navigation bars and populate the
		standard CSS `env(safe-area-inset-*)` values `layout.css` already reads —
		required for Android 15+'s enforced edge-to-edge to not clip content behind
		the system bars. Harmless on the web: browsers ignore `viewport-fit` outside
		a fullscreen/standalone display mode. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#ffffff" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<script>
			// Apply the persisted theme choice before first paint to avoid a
			// flash of the wrong theme. Mirrors src/lib/ui/theme.svelte.ts.
			(function () {
				try {
					var stored = localStorage.getItem('lyre:theme');
					if (stored === 'light' || stored === 'dark') {
						document.documentElement.setAttribute('data-theme', stored);
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
